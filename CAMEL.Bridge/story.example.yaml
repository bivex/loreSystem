# run_full_story.py — story config example
# Usage: python3 CAMEL.Bridge/run_full_story.py --config CAMEL.Bridge/story.example.yaml
#
# CLI flags override any value set here.
# Example override: --chapters 5 --no-reset

# --- Required ---
tenant_id: 1
world_id: 1
theme: "Тёмное фэнтези: герой просыпается в бочке в пещере орков"

# --- Narrative ---
chapters: 15
output_language: ru          # ru | en | uk

# Seed characters (LLM will weave them into the story)
characters:
  - Мара Восс
  - Ивен Хейл

# --- Storage ---
db_path: lore_system.db
env_file: .env               # path to .env with CAMEL_MODEL_* / OPENAI_API_KEY / etc.

# --- Memory ---
# Requires CAMEL_MEMORY_QDRANT_URL in .env
with_memory: true

# --- Run control ---
# reset: true   → wipe lore tables + Qdrant collection before starting (safe default)
# reset: false  → continue from existing data (use --no-reset on CLI)
reset: true

# --- Per-chapter outlines (optional) ---
# Define story beats for specific chapters. Chapters without an entry are generated freely.
# Keys are chapter numbers (integers). Values are plain text plot descriptions.
# The LLM will treat these as hard requirements ("follow exactly").
#
# chapter_outlines:
#   1: "Герой просыпается в бочке. Орки устраивают допрос. Побег через канализацию."
#   2: "Герой выходит в город. Встречает Мару Восс у рынка. Узнаёт о пропавшем артефакте."
#   7: "Середина пути. Предательство союзника. Герой остаётся один."
#   15: "Финальная схватка в башне. Выбор: уничтожить артефакт или использовать его."
