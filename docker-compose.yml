version: '3.8'

services:
  # Main Lore System application
  lore-system:
    build: .
    container_name: lore-system
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - lore_data:/app/data
    depends_on:
      - qdrant
    command: tail -f /dev/null
    ports:
      - "8008:8000"
      - "12345:12345"

  # Vector database for CAMEL.Bridge (Memory v1)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lore-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  lore_data:
  qdrant_data:

