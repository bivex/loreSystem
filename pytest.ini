[pytest]
minversion = 6.0
addopts = --cov=src --cov-report=term-missing --cov-config=pyproject.toml
python_files = test_*.py
testpaths = tests
pythonpath = /Volumes/External/Code/loreSystem/src
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (database, ES)
    e2e: End-to-end tests (full system)
    slow: Slow running tests
    verification: Verification and domain/database validation tests
